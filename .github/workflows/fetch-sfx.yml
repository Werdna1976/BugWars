name: Fetch sound packs

# One-off helper: downloads CC0 Kenney sound packs and pushes them to a
# throwaway asset-staging branch, since the dev container can't reach kenney.nl.
# The sounds the game uses are picked from there and committed to public/sfx.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-sfx.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download packs
        run: |
          set -uo pipefail
          mkdir -p packs
          for slug in impact-sounds interface-sounds rpg-audio sci-fi-sounds digital-audio ui-audio casino-audio; do
            page=$(curl -fsL -A "Mozilla/5.0" "https://kenney.nl/assets/$slug" || true)
            zip=$(echo "$page" | grep -oE 'https://kenney.nl/media/pages/assets/[^"]+\.zip' | head -1)
            echo "::warning::$slug -> ${zip:-no zip link found}"
            if [ -n "$zip" ]; then
              curl -fsL -A "Mozilla/5.0" -o "packs/$slug.zip" "$zip" && unzip -q -o "packs/$slug.zip" -d "packs/$slug" && rm "packs/$slug.zip"
            fi
          done
          find packs -type f | sed 's|^packs/||' | sort > packs/LISTING.txt
          echo "::warning::$(wc -l < packs/LISTING.txt) files, $(du -sh packs | cut -f1)"
      - name: Push to asset-staging branch
        run: |
          cd packs
          find . -type f ! -iname '*.ogg' ! -iname '*.wav' ! -iname '*.mp3' ! -name LISTING.txt ! -iname 'license*' -delete
          git init -q
          git checkout -q -b asset-staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Kenney sound packs (CC0) for picking" 2>&1 | tail -2 | sed 's/^/::warning::commit: /'
          if ! out=$(git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/asset-staging 2>&1); then
            echo "$out" | tail -4 | sed 's/^/::error::push: /'
            exit 1
          fi
